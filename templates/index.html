<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio-Analyzer | Deepfake & Gender Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg-color: #ffffff;
            --text-color: #212529;
            --muted-text-color: #6c757d;
            --primary-color: #0d6efd;
            --border-color: #dee2e6;
            --upload-bg: #f8f9fa;
        }
        [data-theme="dark"] {
            --bg-color: #0d1117;
            --card-bg-color: #161b22;
            --text-color: #e8e6e3;
            --muted-text-color: #8b949e;
            --primary-color: #3b82f6;
            --border-color: #30363d;
            --upload-bg: #0d1117;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .main-content {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .analyzer-card {
            background-color: var(--card-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            width: 100%;
            max-width: 800px;
            margin: 1rem;
        }
        .theme-switch { position: absolute; top: 1.5rem; right: 1.5rem; }
        .form-switch .form-check-input {
            width: 50px;
            height: 25px;
            cursor: pointer;
            background-color: #495057;
            border-color: #495057;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3e%3ccircle r='3' fill='%23fff'/%3e%3c/svg%3e");
            transition: all 0.3s ease;
        }
        .form-switch .form-check-input:checked {
            background-color: var(--primary-color);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3e%3ccircle r='3' fill='%23fff'/%3e%3c/svg%3e");
        }
        .form-check-input { position: relative; }
        .form-check-input::before, .form-check-input::after {
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            font-size: 14px;
            top: 50%;
            transform: translateY(-50%);
            transition: opacity 0.3s ease;
        }
        .form-check-input::before { content: '\f185'; left: 5px; color: #f39c12; opacity: 0; }
        .form-check-input::after { content: '\f186'; right: 5px; color: #f1c40f; opacity: 1; }
        .form-check-input:checked::before { opacity: 1; }
        .form-check-input:checked::after { opacity: 0; }
        [data-theme="dark"] .text-muted { color: var(--muted-text-color) !important; }
        .upload-area {
            background: var(--upload-bg);
            border: 2px dashed var(--border-color);
            border-radius: 0.75rem;
            padding: 2.5rem;
            transition: all 0.3s ease;
        }
        .upload-area:hover, .upload-area.dragover { border-color: var(--primary-color); transform: scale(1.02); }
        .waveform-container { height: 100px; }
        .result-card { background-color: var(--upload-bg); border-radius: 0.75rem; }
        .result-card p { font-size: 1.75rem; font-weight: 700; color: var(--text-color); }
        .example-btn { background: var(--upload-bg); border: 1px solid var(--border-color); color: var(--text-color); }
    </style>
</head>
<body>
<div class="main-content">
    <div class="analyzer-card p-4 p-lg-5 position-relative">
        <div class="theme-switch form-check form-switch">
            <input class="form-check-input" type="checkbox" id="theme-toggle">
        </div>
        <div class="text-center mb-4">
            <h1 class="h2 fw-bold">Audio Analyzer</h1>
            <p class="text-muted">Analyze audio to detect deepfakes and identify gender with confidence scores.</p>
        </div>
        
        <div id="uploadArea" class="upload-area text-center rounded-3 cursor-pointer">
            <i class="fas fa-cloud-upload-alt fa-3x text-muted mb-3"></i>
            <p class="m-0">Drag & Drop or Click to Upload</p>
            <input class="d-none" type="file" id="audio" name="audio" accept="audio/*">
        </div>

        <div class="mt-4">
            <div id="waveform" class="waveform-container"></div>
            <div id="controls" class="mt-2 text-center" style="display:none;">
                <button id="playBtn" class="btn btn-sm btn-outline-secondary"><i class="fas fa-play"></i> / <i class="fas fa-pause"></i></button>
            </div>
        </div>
        
        <div class="text-center my-3" id="loadingSpinner" style="display: none;">
            <div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>
        </div>

        <div id="resultContainer" class="row g-3 mt-3" style="display: none;">
            <div class="col-md-6">
                <div class="result-card p-3 text-center">
                    <p id="resultDeepfake" class="mb-1">-</p>
                    <small id="confidenceDeepfake" class="text-muted">DEEPFAKE ANALYSIS</small>
                </div>
            </div>
            <div class="col-md-6">
                <div class="result-card p-3 text-center">
                    <p id="resultGender" class="mb-1">-</p>
                    <small id="confidenceGender" class="text-muted">GENDER ANALYSIS</small>
                </div>
            </div>
        </div>

        <div class="mt-4 pt-4" style="border-top: 1px solid var(--border-color);">
            <h6 class="text-center text-muted mb-3">Or try an example:</h6>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <button class="btn example-btn" onclick="loadExample('/static/audio/example_real.wav')"><i class="fas fa-check-circle text-success me-2"></i>Real Voice</button>
                <button class="btn example-btn" onclick="loadExample('/static/audio/example_fake.wav')"><i class="fas fa-times-circle text-danger me-2"></i>Fake Voice</button>
            </div>
        </div>
    </div>
</div>
<script>
    const setupTheme = () => {
        const themeToggle = document.getElementById('theme-toggle');
        const setTema = (theme) => {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggle.checked = theme === 'dark';
        };
        themeToggle.addEventListener('change', () => setTema(themeToggle.checked ? 'dark' : 'light'));
        setTema(localStorage.getItem('theme') || 'dark'); // Default to dark
    };

    const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: 'grey',
        progressColor: '#3b82f6',
        height: 100,
        responsive: true,
        barWidth: 2,
        barRadius: 3
    });

    const setupUploadEvents = () => {
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('audio');
        uploadArea.onclick = () => fileInput.click();
        fileInput.onchange = () => handleFile(fileInput.files[0]);
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, e => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });
        uploadArea.addEventListener('dragover', () => uploadArea.classList.add('dragover'));
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', e => {
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });
    };

    const loadExample = async (url) => {
        const response = await fetch(url);
        const blob = await response.blob();
        const file = new File([blob], url.split('/').pop(), { type: 'audio/wav' });
        handleFile(file);
    };

    const handleFile = async (file) => {
        if (!file) return;

        const resultContainer = document.getElementById('resultContainer');
        const spinner = document.getElementById('loadingSpinner');
        const controls = document.getElementById('controls');
        const playBtn = document.getElementById('playBtn');

        wavesurfer.loadBlob(file);
        controls.style.display = 'block';
        playBtn.onclick = () => wavesurfer.playPause();

        resultContainer.style.display = 'none';
        spinner.style.display = 'block';

        const formData = new FormData();
        formData.append('audio', file);

        try {
            const response = await fetch('/api/predict/', { method: 'POST', body: formData });
            const data = await response.json();
            
            const resultDeepfake = document.getElementById('resultDeepfake');
            const resultGender = document.getElementById('resultGender');
            const confDeepfake = document.getElementById('confidenceDeepfake');
            const confGender = document.getElementById('confidenceGender');

            if (response.ok) {
                resultDeepfake.textContent = data.deepfake;
                resultGender.textContent = data.gender;
                confDeepfake.textContent = `Confidence: ${data.confidence_deepfake}`;
                confGender.textContent = `Confidence: ${data.confidence_gender}`;
            } else {
                resultDeepfake.textContent = 'Error';
                confDeepfake.textContent = data.error || 'Prediction failed';
            }
        } catch (err) {
            document.getElementById('resultDeepfake').textContent = 'Error';
            document.getElementById('confidenceDeepfake').textContent = 'Server communication failed';
        } finally {
            spinner.style.display = 'none';
            resultContainer.style.display = 'flex';
        }
    };

    setupTheme();
    setupUploadEvents();
</script>
</body>
</html>
